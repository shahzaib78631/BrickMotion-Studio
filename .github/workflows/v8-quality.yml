name: BrickMotion V8 mechanics regression and build
on:
  push:
  pull_request:
jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify:v8:all
      - run: npm run build

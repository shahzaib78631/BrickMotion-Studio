[package]
name = "brickmotion"
edition.workspace = true
version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
bm = { path = "../bm" }
bm-sys = { path = "../bm-sys" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "default_fonts"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
muda = "0.17"
arboard = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
